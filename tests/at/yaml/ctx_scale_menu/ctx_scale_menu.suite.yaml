name: ctx_scale_menu_suite
app: deepin-reader
module: ctx_scale_menu
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
- action: assert_element
  selector:
    name: Form_CentralDocPage
suites:
- id: suite_ctx_scale_menu_s1
  name: 缩放箭头按钮下拉菜单所有菜单项
  description: 点击 ScaleWidget 的 editArrowBtn 弹出 ScaleMenu，验证各缩放选项
  steps:
  - step_type: action
    action: assert_element
    selector:
      accessible_id: editArrowBtn
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: editArrowBtn
    items:
    - 双页显示
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: editArrowBtn
    items:
    - 默认大小
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: editArrowBtn
    items:
    - 适合页面
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: editArrowBtn
    items:
    - 适应高度
  - step_type: action
    action: dtk_dropdown_menu
    selector:
      accessible_id: editArrowBtn
    items:
    - 适应宽度
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: editArrowBtn
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: scaleEdit_P
teardown:
- action: session_stop
