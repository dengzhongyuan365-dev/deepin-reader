name: titlebar_search_suite
app: deepin-reader
module: titlebar_search
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
- action: assert_element
  selector:
    name: Form_CentralDocPage
suites:
- id: suite_titlebar_search_s1
  name: 标题栏搜索框输入搜索清除和搜索结果导航
  description: 通过主菜单打开 FindWidget，输入搜索词并搜索，验证导航按钮和关闭按钮
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 搜索
  - step_type: action
    action: assert_element
    selector:
      accessible_id: findSearchEdit_P
  - step_type: action
    action: mouse_click
    selector:
      name: DLineEditChildLineEdit
  - step_type: action
    action: keyboard_type_text
    text: test
  - step_type: action
    action: keyboard_press
    key: return
  - step_type: action
    action: assert_element
    selector:
      accessible_id: SP_ArrowDownBtn
  - step_type: action
    action: mouse_click
    selector:
      accessible_id: SP_ArrowDownBtn
  - step_type: action
    action: mouse_click
    selector:
      accessible_id: SP_ArrowUpBtn
  - step_type: action
    action: mouse_click
    selector:
      accessible_id: closeButton
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: findSearchEdit_P
teardown:
- action: session_stop
