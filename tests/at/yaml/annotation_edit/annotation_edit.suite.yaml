name: annotation_edit_suite
app: deepin-reader
module: annotation_edit
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
- action: assert_element
  selector:
    name: Form_CentralDocPage
suites:
- id: suite_annotation_edit_s1
  name: 注释文本编辑框输入文本
  description: 右键文档添加注释，等待注释编辑框就绪后输入文本并确认
  steps:
  - step_type: action
    action: dtk_context_menu
    ref: Form_CentralDocPage
    items:
    - 添加注释
  - step_type: action
    action: assert_element
    selector:
      accessible_id: PTextEdit
  - step_type: action
    action: mouse_click
    selector:
      accessible_id: PTextEdit
  - step_type: action
    action: keyboard_type_text
    text: test note
  - step_type: action
    action: keyboard_press
    key: return
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: PTextEdit
teardown:
- action: session_stop
