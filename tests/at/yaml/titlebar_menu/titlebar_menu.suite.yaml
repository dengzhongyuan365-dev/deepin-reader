name: titlebar_menu_suite
app: deepin-reader
module: titlebar_menu
setup:
- action: session_start
  command: deepin-reader ${TEST_FILES_DIR}/normal.pdf
- action: assert_element
  selector:
    name: Form_CentralDocPage
suites:
- id: suite_titlebar_menu_s1
  name: 标题栏主菜单工具搜索导航
  description: 通过标题栏主菜单切换工具并打开搜索，验证文档区域始终可用
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 工具
    - 选择工具
  - step_type: action
    action: dtk_main_menu
    items:
    - 工具
    - 手形工具
  - step_type: action
    action: dtk_main_menu
    items:
    - 搜索
  - step_type: action
    action: keyboard_press
    key: escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: Form_CentralDocPage
teardown:
- action: session_stop
